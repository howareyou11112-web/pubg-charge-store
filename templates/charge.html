<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>اختيار كمية الشحن</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f0f0f; color: white; text-align: right; }
        .package-card { background-color: #1a1a1a; border: 1px solid #444; transition: 0.3s; cursor: pointer; }
        .package-card:hover { border-color: #d4af37; transform: scale(1.02); }
    </style>
</head>
<body>
<div class="container py-5 text-center">
    <h2 class="mb-4">مرحباً باللاعب: <span class="text-warning">{{ player_id }}</span></h2>
    <p>اختر كمية الشدات المطلوبة:</p>

    <div class="row justify-content-center">
        <div class="col-md-8">
            <form action="/checkout" method="POST">
                <input type="hidden" name="user_id" value="{{ player_id }}">
                <select name="amount" class="form-select form-select-lg mb-4 bg-dark text-white border-secondary">
                    <option value="60 شدة">60 شدة</option>
                    <option value="325 شدة" selected>325 شدة</option>
                    <option value="660 شدة">660 شدة</option>
                    <option value="1800 شدة">1800 شدة</option>
                </select>
                <button type="submit" class="btn btn-warning btn-lg w-100 fw-bold">تأكيد الطلب</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
