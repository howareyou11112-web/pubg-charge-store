<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="شحن شدات ببجي، ميداس باي العراق، شحن UC ببجي 2026، NSxIRAQ-STOR، دفع آمن، توصيل فوري">
    <title>NSxIRAQ-STOR | شحن شدات ببجي PUBG Mobile UC</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #0b0b0b; 
            color: #ffffff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column; min-height: 100vh;
        }
        
        /* تأثير التوهج الذهبي مثل ميداس باي */
        .card { 
            background-color: #161616; 
            border: 1px solid #d4af37; 
            border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 15px rgba(212, 175, 55, 0.1);
            padding: 25px;
            margin-top: 20px;
        }

        .store-title {
            color: #d4af37; font-weight: bold; letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        /* تنسيق النصوص لتكون واضحة جداً */
        .status-text { color: #ffffff !important; font-size: 0.9rem; margin-bottom: 15px; }
        
        .pubg-logo {
            width: 160px; filter: drop-shadow(0 0 12px #d4af37);
            margin: 15px 0;
        }

        /* تحسين خانة الإدخال (Input) */
        .form-control { 
            background-color: #ffffff !important; 
            border: 2px solid #d4af37; 
            color: #000000 !important; 
            font-weight: bold; font-size: 1.1rem;
            text-align: center; height: 55px; border-radius: 8px;
        }

        .btn-gold { 
            background: linear-gradient(45deg, #d4af37, #f1c40f);
            color: #000; font-weight: bold; border-radius: 8px; 
            padding: 15px; font-size: 1.2rem; border: none;
            width: 100%; transition: 0.3s; margin-top: 15px;
        }
        .btn-gold:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4); }

        /* تذييل الصفحة (Footer) */
        footer {
            margin-top: auto; padding: 20px;
            background: #111; border-top: 1px solid #222;
            color: #aaa; font-size: 0.8rem; text-align: center;
        }
        .rights-text { color: #ffffff !important; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container mt-4">
        <div class="text-center">
            <h2 class="store-title">NSxIRAQ-STOR</h2>
            <p class="text-light">الوكيل المعتمد لشحن الشدات في العراق</p>
            
            <div class="card mx-auto" style="max-width: 420px;">
                <img src="https://www.pubgmobile.com/images/event/pubgm_anniversary/logo.png" 
                     alt="PUBG Mobile" class="pubg-logo mx-auto">
                
                <h5 class="status-text">قم بإدخال معرف اللاعب (ID) الخاص بك</h5>
                
                <form action="/verify" method="POST">
                    <div class="mb-3">
                        <input type="number" name="player_id" class="form-control" 
                               placeholder="1234567890" required>
                    </div>
                    <button type="submit" class="btn btn-gold">تحقق من الحساب الآن</button>
                </form>
                
                <div class="mt-3">
                    <small style="color: #888;">سيتم التحقق من الاسم المستعار تلقائياً</small>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p class="mb-1">نحن نستخدم تشفير 256-bit لحماية بياناتك</p>
        <div class="rights-text">جميع الحقوق محفوظة © 2026 NSxIRAQ-STOR</div>
        <p class="mt-2 small" style="opacity: 0.5;">هذا الموقع غير تابع لشركة Tencent ولكننا نستخدم واجهة ربط رسمية</p>
    </footer>

</body>
</html>
