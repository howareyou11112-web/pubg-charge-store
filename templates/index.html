<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSxIRAQ-STOR | متجر الشحن</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
   <style>
    body { background-color: #0f0f0f; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .card { background-color: #1a1a1a; border: 1px solid #d4af37; border-radius: 15px; }
    .btn-gold { background-color: #d4af37; color: black; font-weight: bold; border-radius: 25px; }
    .btn-gold:hover { background-color: #f1c40f; color: black; }
    .header-logo { color: #d4af37; font-weight: bold; text-shadow: 2px 2px 5px #000; }
    
    /* تعديل خانة إدخال الـ ID لتكون واضحة */
    .form-control { 
        background-color: #f8f9fa; /* جعل الخلفية بيضاء فاتحة */
        border: 1px solid #d4af37; 
        color: #000; /* الكتابة بداخلها بالأسود للوضوح */
        text-align: center; 
    }
    /* تعديل لون "رقم التعريف (ID)" ليكون رمادي فاتح جداً */
    .form-control::placeholder {
        color: #6c757d !important; 
        opacity: 1; 
    }
    
    /* جعل نص الحقوق ناصع البياض وواضح */
    .footer-text {
        color: #ffffff !important; 
        font-weight: bold;
        text-shadow: 1px 1px 2px #000; /* إضافة ظل خفيف للوضوح */
        margin-top: 20px;
    }
</style>

<p class="text-center footer-text small">جميع الحقوق محفوظة © 2026 NSxIRAQ-STOR</p>
</head>
<body>

<div class="container py-5">
    <div class="text-center mb-5">
        <h1 class="header-logo display-4">NSxIRAQ-STOR</h1>
        <p class="lead">أسرع خدمة شحن شدات في العراق</p>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-4 shadow-lg">
                <div class="text-center mb-4">
    <img src="https://static.wikia.nocookie.net/pubgmobile/images/2/2b/PUBG_Mobile_Korean_Logo.png" 
         alt="PUBG Mobile KR Logo" 
         style="width: 200px; filter: drop-shadow(0 0 10px #d4af37); /* إضافة توهج ذهبي خفيف */"
    >
          </div>
                <h4 class="text-center mb-4">أدخل الـ ID الخاص بك لبدء الشحن</h4>
                
                <form action="/charge" method="POST">
                    <div class="mb-3">
                        <input type="text" name="player_id" class="form-control form-control-lg" placeholder="رقم التعريف (ID)" required>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-gold btn-lg">تحقق والاستمرار</button>
                    </div>
                </form>
            </div>
            <p class="text-center mt-4 text-muted small">جميع الحقوق محفوظة © 2026 NSxIRAQ-STOR</p>
        </div>
    </div>
</div>

</body>
</html>
