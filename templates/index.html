<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSxIRAQ-STOR | شحن ببجي موبايل</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --gold: #ffbe00;
            --dark-bg: #0c0d0e;
            --card-bg: #1a1c1f;
            --border: #2d2f33;
        }

        body {
            background-color: var(--dark-bg);
            color: white;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 30px 0;
        }

        .brand-name {
            color: var(--gold);
            font-size: 35px;
            font-weight: 900;
            margin: 0;
        }

        .hero-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            text-align: center;
        }

        /* حل مشكلة الصورة المكسورة في صورك */
        .pubg-banner {
            width: 180px;
            margin-bottom: 15px;
        }

        .input-group {
            margin: 20px 0;
            text-align: right;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #888;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 15px;
            background: #25272b;
            border: 1px solid #3d4148;
            border-radius: 8px;
            color: white;
            font-size: 18px;
            text-align: center;
            box-sizing: border-box;
        }

        /* قسم اختيار الشدات (الذي كان مفقوداً) */
        .uc-section-title {
            text-align: right;
            font-size: 18px;
            margin: 25px 0 15px;
            color: var(--gold);
        }

        .uc-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .uc-item {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        .uc-item:hover, .uc-item.active {
            border-color: var(--gold);
            background: #222529;
        }

        .uc-item img {
            width: 50px;
            margin-bottom: 10px;
        }

        .uc-amount {
            display: block;
            font-weight: bold;
            font-size: 16px;
        }

        .uc-price {
            color: var(--gold);
            font-size: 13px;
        }

        .btn-pay {
            background: var(--gold);
            color: black;
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 18px;
            margin-top: 30px;
            cursor: pointer;
        }

        /* حل تداخل الفوتر */
        footer {
            margin-top: 50px;
            padding: 30px;
            border-top: 1px solid var(--border);
            color: #555;
            font-size: 12px;
            line-height: 1.8;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1 class="brand-name">NSxIRAQ-STOR</h1>
        <p style="color: #666;">أسرع شحن في العراق 🇮🇶</p>
    </header>

    <div class="hero-card">
        <img src="https://www.pubgmobile.com/images/event/pubgm_anniversary/logo.png" class="pubg-banner" alt="PUBG">
        
        <div class="input-group">
            <label><i class="fa fa-user"></i> معرف اللاعب (ID)</label>
            <input type="number" id="player_id" placeholder="أدخل الـ ID الخاص بك" required>
        </div>
    </div>

    <div class="uc-section-title">اختر كمية الشحن المطلوبة:</div>
    
    <div class="uc-grid">
        <div class="uc-item" onclick="selectUC(this, '60')">
            <img src="https://cdn.midasbuy.com/images/apps/pubgm/158x158.png" alt="UC">
            <span class="uc-amount">60 UC</span>
            <span class="uc-price">1,250 IQD</span>
        </div>
        <div class="uc-item" onclick="selectUC(this, '325')">
            <img src="https://cdn.midasbuy.com/images/apps/pubgm/158x158.png" alt="UC">
            <span class="uc-amount">325 UC</span>
            <span class="uc-price">6,500 IQD</span>
        </div>
        <div class="uc-item" onclick="selectUC(this, '660')">
            <img src="https://cdn.midasbuy.com/images/apps/pubgm/158x158.png" alt="UC">
            <span class="uc-amount">660 UC</span>
            <span class="uc-price">13,000 IQD</span>
        </div>
        <div class="uc-item" onclick="selectUC(this, '1800')">
            <img src="https://cdn.midasbuy.com/images/apps/pubgm/158x158.png" alt="UC">
            <span class="uc-amount">1800 UC</span>
            <span class="uc-price">32,500 IQD</span>
        </div>
    </div>

    <button class="btn-pay" onclick="startCharge()">اشحن الآن</button>

    <footer>
        حقوق النشر © 2026 NSxIRAQ-STOR. جميع الحقوق محفوظة.<br>
        المتجر رقم 1 في العراق لتزويد خدمات الألعاب الرقمية.
    </footer>
</div>

<script>
    function selectUC(element, amount) {
        document.querySelectorAll('.uc-item').forEach(i => i.classList.remove('active'));
        element.classList.add('active');
        console.log("Selected: " + amount + " UC");
    }

    function startCharge() {
        const id = document.getElementById('player_id').value;
        if(!id) {
            alert("يرجى إدخال ID اللاعب أولاً!");
            return;
        }
        alert("جاري تحويلك لبوابة الدفع في العراق...");
    }
</script>

</body>
</html>
