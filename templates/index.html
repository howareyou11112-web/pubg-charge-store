<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSxIRAQ-STOR | شحن شدات ببجي الرسمي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #0f1113; color: white; margin: 0; }
        .text-primary { color: #ffbe00; }
        .bg-primary { background-color: #ffbe00; }
        .border-border { border-color: #2d3135; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">

    <header class="w-full max-w-md text-center py-8">
        <div class="w-20 h-20 bg-primary rounded-3xl mx-auto flex items-center justify-center shadow-[0_0_30px_rgba(255,190,0,0.3)] mb-4">
            <span class="text-black text-3xl font-black">NS</span>
        </div>
        <h1 class="text-2xl font-black tracking-tight">NSxIRAQ-STOR</h1>
        <p class="text-gray-500 text-sm mt-1">المتجر الرسمي لشحن الألعاب في العراق</p>
    </header>

    <main class="w-full max-w-md bg-[#16181b] border border-border rounded-[2.5rem] p-6 shadow-2xl">
        
        <div class="mb-8">
            <label class="block text-xs font-bold text-gray-500 mb-3 uppercase mr-2">أدخل معرف اللاعب (Player ID)</label>
            <div class="relative">
                <input type="number" id="p_id" placeholder="مثال: 5123456789" 
                    class="w-full bg-[#1e2124] border border-border rounded-2xl py-4 px-6 text-white focus:outline-none focus:border-primary transition-all font-bold text-right">
                <i class="fas fa-id-badge absolute left-5 top-1/2 -translate-y-1/2 text-gray-600"></i>
            </div>
        </div>

        <div class="mb-8">
            <label class="block text-xs font-bold text-gray-500 mb-3 uppercase mr-2">اختر باقة الشحن</label>
            <div id="uc_grid" class="grid grid-cols-2 gap-3">
                </div>
        </div>

        <button onclick="sendOrder()" class="w-full bg-primary hover:bg-[#e6ab00] text-black font-black py-5 rounded-2xl transition-all transform active:scale-95 shadow-[0_10px_20px_rgba(255,190,0,0.2)] flex items-center justify-center gap-2">
            <span>إتمام الطلب عبر واتساب</span>
            <i class="fab fa-whatsapp text-xl"></i>
        </button>
    </main>

    <footer class="w-full max-w-md mt-10 mb-10">
        <div class="p-6 bg-[#16181b] border border-border rounded-[2rem] text-center">
            <p class="text-gray-500 text-[10px] mb-4 uppercase tracking-[0.2em] font-bold">طرق الدفع المحلية المدعومة</p>
            <div class="flex justify-center gap-6 opacity-80">
                <div class="flex flex-col items-center">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/d/d1/Zain_Logo.svg" class="h-6 mb-1" alt="Zain">
                    <span class="text-[8px] text-gray-600">Zain Cash</span>
                </div>
                <div class="flex flex-col items-center">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/b/b3/Asiacell_logo.png" class="h-6 mb-1" alt="Asiacell">
                    <span class="text-[8px] text-gray-600">Asiacell</span>
                </div>
                <div class="flex flex-col items-center">
                    <i class="fas fa-credit-card text-xl mb-1 text-gray-500"></i>
                    <span class="text-[8px] text-gray-600">Qi Card</span>
                </div>
            </div>
        </div>
        <p class="text-center text-gray-700 text-[10px] mt-6">© 2026 NSxIRAQ-STOR | أحمد صافي أسود | جامعة تكريت - ذكاء اصطناعي</p>
    </footer>

    <script>
        const packs = [
            { id: 1, uc: "60 UC", price: "1,250 IQD", img: "https://www.midasbuy.com/static/images/items/pubgm/1.png" },
            { id: 2, uc: "325 UC", price: "6,500 IQD", img: "https://www.midasbuy.com/static/images/items/pubgm/2.png" },
            { id: 3, uc: "660 UC", price: "13,000 IQD", img: "https://www.midasbuy.com/static/images/items/pubgm/3.png" },
            { id: 4, uc: "1800 UC", price: "32,500 IQD", img: "https://www.midasbuy.com/static/images/items/pubgm/4.png" },
            { id: 5, uc: "3850 UC", price: "65,000 IQD", img: "https://www.midasbuy.com/static/images/items/pubgm/5.png" },
            { id: 6, uc: "8100 UC", price: "130,000 IQD", img: "https://www.midasbuy.com/static/images/items/pubgm/6.png" }
        ];

        let selectedPack = null;
        const grid = document.getElementById('uc_grid');

        packs.forEach(p => {
            const card = document.createElement('div');
            card.className = "bg-[#1e2124] border border-border rounded-2xl p-4 text-center cursor-pointer transition-all hover:scale-[1.03] group";
            card.onclick = () => {
                document.querySelectorAll('#uc_grid > div').forEach(d => {
                    d.style.borderColor = '#2d3135';
                    d.style.background = '#1e2124';
                });
                card.style.borderColor = '#ffbe00';
                card.style.background = 'rgba(255, 190, 0, 0.05)';
                selectedPack = p;
            };
            card.innerHTML = `
                <img src="${p.img}" class="w-10 h-10 mx-auto mb-2 group-hover:scale-110 transition-transform" onerror="this.src='https://via.placeholder.com/50/ffbe00/000000?text=UC'">
                <div class="font-black text-white">${p.uc}</div>
                <div class="text-primary text-[10px] font-bold">${p.price}</div>
            `;
            grid.appendChild(card);
        });

        function sendOrder() {
            const id = document.getElementById('p_id').value;
            if(!id || !selectedPack) {
                alert("يرجى إدخال الـ ID واختيار الباقة أولاً!");
                return;
            }
            const message = `طلب شحن جديد من متجر NSxIRAQ-STOR%0A--------------------------%0Aالـ ID: ${id}%0Aالباقة: ${selectedPack.uc}%0Aالسعر: ${selectedPack.price}%0A--------------------------%0Aالمرسل: أحمد صافي أسود`;
            window.open(`https://wa.me/9647701721558?text=${message}`, '_blank');
        }
    </script>
</body>
</html>
