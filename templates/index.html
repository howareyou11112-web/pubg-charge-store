<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSxIRAQ-STOR | شحن شدات ببجي</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* إعدادات الخلفية والألوان العامة */
        body { 
            background-color: #0f0f0f; 
            color: #ffffff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        /* تصميم الكارت الرئيسي */
        .card { 
            background-color: #1a1a1a; 
            border: 2px solid #d4af37; 
            border-radius: 20px; 
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
            padding: 30px;
        }

        /* عنوان المتجر */
        .store-title {
            color: #d4af37;
            font-size: 2.5rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        /* النصوص الفرعية - جعلناها بيضاء لتكون واضحة */
        .sub-text {
            color: #ffffff !important;
            font-weight: 500;
            margin-bottom: 25px;
        }

        /* تصميم شعار ببجي */
        .pubg-logo {
            width: 180px;
            filter: drop-shadow(0 0 10px #d4af37);
            margin-bottom: 20px;
        }

        /* تصميم خانة إدخال الـ ID */
        .form-control { 
            background-color: #ffffff !important; 
            border: 2px solid #d4af37; 
            color: #000000 !important; 
            font-weight: bold;
            text-align: center; 
            height: 50px;
            border-radius: 10px;
        }
        .form-control::placeholder {
            color: #6c757d !important; 
            font-weight: normal;
        }

        /* تصميم الزر الذهبي */
        .btn-gold { 
            background-color: #d4af37; 
            color: #000000; 
            font-weight: bold; 
            border-radius: 50px; 
            padding: 12px 40px;
            font-size: 1.2rem;
            border: none;
            transition: 0.3s;
            width: 100%;
            margin-top: 15px;
        }
        .btn-gold:hover { 
            background-color: #f1c40f; 
            transform: scale(1.05);
            color: #000000;
        }

        /* نصوص الحقوق في الأسفل */
        footer {
            margin-top: auto;
            padding: 20px;
            color: #ffffff !important;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container mt-5">
        <div class="text-center">
            <h1 class="store-title">NSxIRAQ-STOR</h1>
            <p class="sub-text">أسرع خدمة شحن شدات في العراق</p>
            
            <div class="card mx-auto" style="max-width: 450px;">
                <img src="https://www.pubgmobile.com/images/event/pubgm_anniversary/logo.png" 
                     alt="PUBG Mobile" class="pubg-logo mx-auto">
                
                <h5 class="sub-text mb-4">أدخل الـ ID الخاص بك لبدء الشحن</h5>
                
                <form action="/verify" method="POST">
                    <div class="mb-3">
                        <input type="text" name="player_id" class="form-control" 
                               placeholder="رقم التعريف (ID)" required>
                    </div>
                    <button type="submit" class="btn btn-gold">تحقق والاستمرار</button>
                </form>
            </div>
        </div>
    </div>

    <footer>
        جميع الحقوق محفوظة © 2026 NSxIRAQ-STOR
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
