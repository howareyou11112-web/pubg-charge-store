<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSxIRAQ-STOR | متجر الشحن الرسمي</title>
    <style>
        :root { --gold: #ffbe00; --bg: #0c0d0e; --card: #161719; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 20px; text-align: center; }
        
        .brand { color: var(--gold); font-size: 35px; font-weight: 900; margin-bottom: 5px; }
        .tagline { color: #888; font-size: 14px; margin-bottom: 30px; }

        .container { max-width: 500px; margin: 0 auto; }

        .card { 
            background: var(--card); 
            border: 1px solid #2d2f33; 
            border-radius: 20px; 
            padding: 25px; 
            margin-bottom: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        /* حل مشكلة الصور المكسورة */
        .pubg-logo { width: 140px; margin-bottom: 15px; filter: drop-shadow(0 0 10px var(--gold)); }

        .input-group { margin: 20px 0; }
        .input-group label { display: block; margin-bottom: 10px; color: #bbb; font-size: 14px; }
        
        input { 
            width: 100%; padding: 16px; background: #212327; border: 1px solid #3d4148; 
            border-radius: 10px; color: white; font-size: 18px; text-align: center; box-sizing: border-box;
        }

        input:focus { outline: 2px solid var(--gold); border-color: transparent; }

        .btn { 
            background: var(--gold); color: black; width: 100%; padding: 16px; 
            border: none; border-radius: 10px; font-weight: bold; font-size: 18px; 
            cursor: pointer; transition: 0.3s; margin-top: 10px;
        }

        .btn:hover { transform: scale(1.02); background: #e5ab00; }

        /* حل مشكلة تداخل الفوتر */
        footer { 
            margin-top: 50px; padding: 20px; border-top: 1px solid #222; 
            color: #555; font-size: 11px; line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="brand">NSxIRAQ-STOR</div>
        <div class="tagline">أسرع خدمة شحن شدات في العراق</div>

        <div class="card">
            <img src="https://www.pubgmobile.com/images/event/pubgm_anniversary/logo.png" class="pubg-logo" alt="PUBG">
            
            <form action="/verify" method="POST">
                <div class="input-group">
                    <label>أدخل معرف اللاعب (ID) للتحقق من الحساب</label>
                    <input type="number" name="player_id" placeholder="ID اللاعب" required>
                </div>
                <button type="submit" class="btn">تحقق والاستمرار</button>
            </form>
        </div>

        <footer>
            جميع الحقوق محفوظة © 2026 NSxIRAQ-STOR <br>
            نظام شحن آمن وتلقائي عبر خوادم اللعبة مباشرة
        </footer>
    </div>

</body>
</html>
