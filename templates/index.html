<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSxIRAQ-STOR | شحن ببجي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { primary: '#ffbe00', darkBg: '#0c0d0e', cardBg: '#1a1c1f', border: '#2d2f33' } } }
        }
    </script>
</head>
<body class="bg-darkBg text-white min-h-screen font-sans">

    <div class="max-w-md mx-auto px-4 py-10">
        <header class="text-center mb-10">
            <h1 class="text-4xl font-black text-primary tracking-tighter">NSxIRAQ-STOR</h1>
            <p class="text-gray-500 text-sm mt-2">أسرع خدمة شحن في العراق 🇮🇶</p>
        </header>

        <div class="bg-cardBg border border-border rounded-3xl p-6 mb-8 shadow-2xl text-center">
            <img src="https://upload.wikimedia.org/wikipedia/en/a/a2/PUBG_Mobile_Logo.png" 
                 class="w-40 mx-auto mb-6 drop-shadow-[0_0_10px_rgba(255,190,0,0.3)]" alt="PUBG">
            
            <div class="text-right">
                <label class="block text-gray-400 text-sm mb-2 mr-1">أدخل الـ ID الخاص بك لبدء الشحن</label>
                <input type="number" id="p_id" placeholder="ID اللاعب" 
                       class="w-full bg-[#25272b] border border-border rounded-2xl py-4 text-center text-2xl focus:outline-none focus:border-primary transition-all">
            </div>
        </div>

        <h3 class="text-right text-primary font-bold mb-4 mr-2">اختر كمية الـ UC:</h3>
        <div class="grid grid-cols-2 gap-3 mb-8" id="uc_grid"></div>

        <button onclick="sendOrder()" class="w-full bg-primary text-black font-black text-xl py-5 rounded-2xl hover:scale-[1.02] active:scale-95 transition-all">
            <i class="fas fa-bolt ml-2"></i> اشحن الآن
        </button>
    </div>

    <script>
        const packs = [
            { id: 1, uc: "60 UC", price: "1,250 IQD" },
            { id: 2, uc: "325 UC", price: "6,500 IQD" },
            { id: 3, uc: "660 UC", price: "13,000 IQD" },
            { id: 4, uc: "1800 UC", price: "32,500 IQD" },
            { id: 5, uc: "3850 UC", price: "65,000 IQD" },
            { id: 6, uc: "8100 UC", price: "130,000 IQD" }
        ];

        let selectedPack = null;
        const grid = document.getElementById('uc_grid');

        packs.forEach(p => {
            const card = document.createElement('div');
            card.className = "bg-cardBg border border-border rounded-2xl p-4 text-center cursor-pointer transition-all hover:border-gray-500";
            card.id = `card-${p.id}`;
            card.onclick = () => {
                document.querySelectorAll('#uc_grid > div').forEach(d => d.style.borderColor = '#2d2f33');
                card.style.borderColor = '#ffbe00';
                selectedPack = p;
            };
            // رابط صورة عملة الـ UC الموثوق
            card.innerHTML = `
                <img src="https://www.pubgmobile.com/common/images/icon_uc.png" class="w-10 mx-auto mb-2">
                <div class="font-bold text-lg">${p.uc}</div>
                <div class="text-primary text-xs">${p.price}</div>
            `;
            grid.appendChild(card);
        });

        function sendOrder() {
            const id = document.getElementById('p_id').value;
            if(!id || !selectedPack) return alert("تأكد من إدخال الـ ID واختيار الباقة!");
            alert("تم استلام طلبك لـ " + selectedPack.uc);
        }
    </script>
</body>
</html>
