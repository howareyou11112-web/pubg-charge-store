            </div>
        </div>

            <div id="uc_grid" class="grid grid-cols-2 gap-4">
                </div>
        </div>

        <button onclick="sendOrder()" class="w-full bg-[#ffbe00] hover:bg-[#e6ab00] text-black font-black py-5 rounded-2xl transition-all transform active:scale-95 shadow-xl flex items-center justify-center gap-3">
            <span class="text-lg">إتمام الطلب عبر واتساب</span>
            <i class="fab fa-whatsapp text-2xl"></i>
        </button>
    </main>
